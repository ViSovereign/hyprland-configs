# Monitor
source = ~/.config/hypr/conf/monitors/active.conf

# Environment
source = ~/.config/hypr/conf/environments/active.conf

# Decoration
source = ~/.config/hypr/conf/decorations/default.conf

# Keyboard
source = ~/.config/hypr/conf/keyboard.conf

# Load color file
#source = ~/.config/hypr/colors.conf

# Autostart
source = ~/.config/hypr/conf/autostart.conf

# Load configuration files
source = ~/.config/hypr/conf/windows/default.conf
source = ~/.config/hypr/conf/layouts/active.conf
source = ~/.config/hypr/conf/workspaces/active.conf
source = ~/.config/hypr/conf/misc.conf
source = ~/.config/hypr/conf/keybindings/active.conf
source = ~/.config/hypr/conf/windowrules/active.conf

# Animation
source =  ~/.config/hypr/conf/animations/fast.conf

# Environment for xdg-desktop-portal-hyprland
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=hyprland

source = /home/b/.config/hypr/noctalia/noctalia-colors.conf

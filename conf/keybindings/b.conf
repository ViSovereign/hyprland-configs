#    ╻┏ ┏━╸╻ ╻   ┏┓ ╻┏┓╻╺┳┓┏━┓
#    ┣┻┓┣╸ ┗┳┛   ┣┻┓┃┃┗┫ ┃┃┗━┓
#    ╹ ╹┗━╸ ╹    ┗━┛╹╹ ╹╺┻┛┗━┛
# See https://wiki.hyprland.org/Configuring/Keywords/
#  &  https://wiki.hyprland.org/Configuring/Binds/

# Set Variable
$HYPRSCRIPTS = ~/.config/hypr/scripts
$OPENAPPS = ~/.config/hypr/openapps
$SCRIPTS = ~/.config/hypr/scripts
$MENU = sherlock

# Reload
bind = SUPER CTRL, R, exec, hyprctl reload # Reload Hyprland configuration

# Applications
bind = SUPER, X, exec, $OPENAPPS/terminal.sh # Open a terminal
bind = SUPER, B, exec, $OPENAPPS/browser.sh # Open Zen
bind = SUPER, E, exec, $OPENAPPS/filemanager.sh # Open a file browser
bind = SUPER, D, exec, vesktop # Open Discord but good
bind = SUPER, S, exec, $OPENAPPS/steam.sh # Let's game
bind = SUPER, L, exec, $OPENAPPS/ai.sh # Open a LM Studios
bind = SUPER, O, exec, $OPENAPPS/resourcemonitor.sh # Open system monitor
bind = SUPER CTRL, E, exec, $OPENAPPS/emojipicker.sh # Search for an emoji
bind = SUPER, SPACE, exec, vicinae vicinae://toggle
bind = SUPER, C, exec, pkill $MENU || $MENU

# Windows
bind = SUPER, Q, killactive                                                              # Kill active window
bind = SUPER SHIFT, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill # Quit active window and all open instances
bind = SUPER, F, fullscreen, 0                                                           # Set active window to fullscreen
bind = SUPER, W, fullscreen, 1                                                           # Maximize Window
bind = SUPER, T, togglefloating                                                          # Toggle active windows into floating mode
bind = SUPER SHIFT, T, workspaceopt, allfloat                                            # Toggle all windows into floating mode
bind = SUPER, J, togglesplit                                                             # Toggle split
bind = SUPER, left, movefocus, l                                                         # Move focus left
bind = SUPER, right, movefocus, r                                                        # Move focus right
bind = SUPER, up, movefocus, u                                                           # Move focus up
bind = SUPER, down, movefocus, d                                                         # Move focus down
bindm = SUPER, mouse:272, movewindow                                                     # Move window with the mouse
bindm = SUPER, mouse:273, resizewindow                                                   # Resize window with the mouse
bind = SUPER SHIFT, right, resizeactive, 100 0                                           # Increase window width with keyboard
bind = SUPER SHIFT, left, resizeactive, -100 0                                           # Reduce window width with keyboard
bind = SUPER SHIFT, down, resizeactive, 0 100                                            # Increase window height with keyboard
bind = SUPER SHIFT, up, resizeactive, 0 -100                                             # Reduce window height with keyboard
bind = SUPER, G, togglegroup                                                             # Toggle window group
bind = SUPER, K, swapsplit                                                               # Swapsplit
bind = SUPER ALT, left, swapwindow, l                                                    # Swap tiled window left
bind = SUPER ALT, right, swapwindow, r                                                   # Swap tiled window right
bind = SUPER ALT, up, swapwindow, u                                                      # Swap tiled window up
bind = SUPER ALT, down, swapwindow, d                                                    # Swap tiled window down
binde = ALT,Tab,cyclenext                                                                # Cycle between windows
binde = ALT,Tab,bringactivetotop                                                         # Bring active window to the top

# Actions
bind = SUPER, A, exec, grim -g "$(slurp)" - | swappy -f - # Take a screenshot
bind = SUPER SHIFT, M, exec, loginctl terminate-user "" # Log off
bind = SUPER CTRL, W, exec, vicinae vicinae://extensions/sovereign/swww-switcher/wpgrid # Open wallpaper selector
bind = SUPER CTRL, K, exec, vicinae vicinae://extensions/sovereign/hypr-keybinds/hyprland-keybinds # Open Hyprland keybinds
bind = SUPER, V, exec, vicinae vicinae://extensions/vicinae/clipboard/history # Clipboard history

# Workspaces
bind = SUPER, 1, workspace, 1  # Open workspace 1
bind = SUPER, 2, workspace, 2  # Open workspace 2
bind = SUPER, 3, workspace, 3  # Open workspace 3

bind = SUPER ALT, 1, workspace, 4  # Open workspace 4
bind = SUPER ALT, 2, workspace, 5  # Open workspace 5
bind = SUPER ALT, 3, workspace, 6  # Open workspace 6

bind = SUPER SHIFT, 1, movetoworkspace, 1  # Move active window to workspace 1
bind = SUPER SHIFT, 2, movetoworkspace, 2  # Move active window to workspace 2
bind = SUPER SHIFT, 3, movetoworkspace, 3  # Move active window to workspace 3
bind = SUPER SHIFT, 4, movetoworkspace, 4  # Move active window to workspace 4
bind = SUPER SHIFT, 5, movetoworkspace, 5  # Move active window to workspace 5
bind = SUPER SHIFT, 6, movetoworkspace, 6  # Move active window to workspace 6

bind = SUPER, Tab, workspace, m+1       # Open next workspacecc
bind = SUPER SHIFT, Tab, workspace, m-1 # Open previous workspace

bind = SUPER CTRL, 1, exec, $HYPRSCRIPTS/moveTo.sh 1  # Move all windows to workspace 1
bind = SUPER CTRL, 2, exec, $HYPRSCRIPTS/moveTo.sh 2  # Move all windows to workspace 2
bind = SUPER CTRL, 3, exec, $HYPRSCRIPTS/moveTo.sh 3  # Move all windows to workspace 3
bind = SUPER CTRL, 4, exec, $HYPRSCRIPTS/moveTo.sh 4  # Move all windows to workspace 4
bind = SUPER CTRL, 5, exec, $HYPRSCRIPTS/moveTo.sh 5  # Move all windows to workspace 5
bind = SUPER CTRL, 6, exec, $HYPRSCRIPTS/moveTo.sh 6  # Move all windows to workspace 6

#bind = SUPER, mouse_down, workspace, e+1  # Open next workspace
#bind = SUPER, mouse_up, workspace, e-1    # Open previous workspacec
bind = SUPER CTRL, down, workspace, empty # Open the next empty workspace

# Fn keys
bind = , XF86MonBrightnessUp, exec, brightnessctl -q s +10%                                                                                                  # Increase brightness by 10%
bind = , XF86MonBrightnessDown, exec, brightnessctl -q s 10%-                                                                                                # Reduce brightness by 10%
bind = , XF86AudioRaiseVolume, exec, sh -c 'pactl set-sink-mute @DEFAULT_SINK@ 0; current=$(pactl get-sink-volume @DEFAULT_SINK@ | grep -oP "[0-9]+(?=%)" | head -1); if [ "$current" -lt 150 ]; then pactl set-sink-volume @DEFAULT_SINK@ +5%; fi'
bind = , XF86AudioLowerVolume, exec, pactl set-sink-mute @DEFAULT_SINK@ 0 && pactl set-sink-volume @DEFAULT_SINK@ -5%                                        # Reduce volume by 5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle                                                                                      # Toggle mute
bind = , XF86AudioPlay, exec, playerctl play-pause                                                                                                           # Audio play pause
bind = , XF86AudioPause, exec, playerctl pause                                                                                                               # Audio pause
bind = , XF86AudioNext, exec, playerctl next                                                                                                                 # Audio next
bind = , XF86AudioPrev, exec, playerctl previous                                                                                                             # Audio previous
bind = , XF86VoiceCommand, exec, sh -c 'pactl set-source-mute @DEFAULT_SOURCE@ toggle; state=$(pactl get-source-mute @DEFAULT_SOURCE@ | awk "{print \$2}"); if [ "$state" = "yes" ]; then notify-send "🎤 Mic muted"; else notify-send "🎤 Mic unmuted"; fi'
bind = , XF86Lock, exec, hyprlock                                                                                                                            # Open screenlock
bind = , XF86Tools, exec, vicinae vicinae://toggle
bind = , code:238, exec, brightnessctl -d smc::kbd_backlight s +10
bind = , code:237, exec, brightnessctl -d smc::kbd_backlight s 10-

layerrule {
  name = noctalia
  match:namespace = noctalia-background-.*$
  ignore_alpha = 0.25
  blur = true
  blur_popups = false
}

layerrule {
  name = vicinae
  match:class = vicinae
  ignore_alpha = 0.25
  blur = true
  blur_popups = false
}

windowrule {
  name = popoutpicture
  match:title = (Picture-in-Picture)
  opaque = on
  keep_aspect_ratio = on
  size = 427 240
  max_size = 1280 720
  min_size = 427 240
  float = on
  #move = 2075 10
  move = 10 10
  border_size = 0
}

windowrule {
  name = files
  match:class = org.gnome.Nautilus
  keep_aspect_ratio = on
  size = 1280 720
  min_size = 1280 720
  float = on
}

